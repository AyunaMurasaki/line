<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紫あゆな 公式LINE｜友だち追加</title>
<meta name="description" content="紫あゆなの公式LINEアカウントです。タップすると友だち追加ができます。英語教室のご案内・ライブのご予約・出演イベントのお知らせ・ファンクラブのご入会まで、ここから承ります。">
<meta property="og:title" content="紫あゆな 公式LINE｜友だち追加">
<meta property="og:description" content="タップすると友だち追加ができます。英語教室・ライブ予約・出演イベント・ファンクラブのご案内はこちらから。">
<meta property="og:image" content="images/portrait.jpg">
<meta property="og:type" content="website">
<style>
:root{
  --turq:#0FA3A3;
  --turq-deep:#086065;
  --turq-soft:#8FD9D6;
  --sky:#29A8E0;
  --sun:#FFC93C;
  --ink:#2B3A44;
  --ink-soft:#5A6B76;
  --paper:#FCFBF9;
  --line:#E4E9EC;
  --radius:16px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
  color:var(--ink);
  background:var(--paper);
  line-height:1.8;
  font-size:16px;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;display:block}
a{color:inherit}

.wrap{max-width:480px;margin:0 auto;padding:0 20px}

/* ---------- hero: 丸ごとタップで友だち追加 ---------- */
.hero-link{
  display:block;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(160deg,var(--turq-deep) 0%,var(--turq) 55%,var(--turq-soft) 100%);
  padding:44px 24px 34px;
  text-align:center;
}
.portrait{
  width:112px;height:112px;border-radius:50%;
  object-fit:cover;object-position:center 22%;
  margin:0 auto 16px;
  border:5px solid #fff;
  box-shadow:0 8px 20px rgba(8,96,101,.35);
}
.hero-link h1{
  margin:0 0 6px;
  font-size:24px;
  letter-spacing:.06em;
  font-weight:700;
}
.hero-link .sub{
  margin:0 0 22px;
  font-size:14px;
  letter-spacing:.04em;
  opacity:.92;
}
.qr-frame{
  width:172px;height:172px;
  margin:0 auto 20px;
  padding:10px;
  border-radius:14px;
  background:#fff;
  box-shadow:0 10px 24px rgba(8,96,101,.3);
}
.qr-frame img{width:100%;height:100%;object-fit:contain}
.cta{
  display:inline-block;
  background:#fff;
  color:var(--turq-deep);
  font-size:17px;font-weight:700;letter-spacing:.06em;
  padding:16px 34px;
  border-radius:999px;
  box-shadow:0 8px 18px rgba(8,96,101,.28);
}
.hero-link .tap-note{
  margin:14px 0 0;
  font-size:12.5px;
  opacity:.85;
}
.hero-link .idsearch{
  margin:6px 0 0;
  font-size:12.5px;
  opacity:.85;
  letter-spacing:.04em;
}

/* ---------- できること ---------- */
section.about{padding:34px 0 44px}
.about h2{
  font-size:15px;
  text-align:center;
  color:var(--ink-soft);
  letter-spacing:.06em;
  margin:0 0 18px;
  font-weight:700;
}
.about ul{
  list-style:none;
  margin:0;padding:0;
  display:grid;gap:10px;
}
.about li{
  display:flex;align-items:center;gap:12px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 16px;
  font-size:14.5px;
}
.about li::before{
  content:"";
  flex:none;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--sun);
}

footer{padding:0 0 40px;text-align:center}
footer p{margin:0;font-size:11.5px;color:var(--ink-soft)}

@media (min-width:480px){
  .hero-link{padding:56px 24px 42px}
}
</style>
</head>
<body>

<a class="hero-link" href="https://lin.ee/VMailZP">
  <img class="portrait" src="images/portrait.jpg" alt="紫あゆな">
  <h1>紫あゆな 公式LINE</h1>
  <p class="sub">タップすると友だち追加ができます</p>
  <div class="qr-frame">
    <img src="images/qr.png" alt="公式LINE 友だち追加QRコード">
  </div>
  <span class="cta">友だち追加はこちら</span>
  <p class="tap-note">画面をどこでもタップすると開きます</p>
  <p class="idsearch">LINE ID検索: @977kuadq</p>
</a>

<section class="about">
  <div class="wrap">
    <h2>友だち追加のメニューから</h2>
    <ul>
      <li>英語教室のご案内とお申し込み</li>
      <li>ライブのご予約</li>
      <li>出演・イベントのお知らせ</li>
      <li>ファンクラブのご入会</li>
    </ul>
  </div>
</section>

<footer>
  <p>&copy; 紫あゆな</p>
</footer>

</body>
</html>
